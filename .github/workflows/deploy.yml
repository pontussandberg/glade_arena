# Deploys to the VPS on every push to the `prod` branch (or by hand from the Actions tab, on
# `prod`). Builds the web client and the game server here, then sends them to the server's
# deploy/arena-deploy.sh. One-time setup: `bash deploy/deploy.sh ci-setup` from your PC.
name: Deploy

on:
  push:
    branches: [prod]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of cancelling it.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/prod'
    # Its secrets are only given to the `prod` branch (ci-setup sets that up).
    environment: production
    # Builds against an older glibc than the server's, so the binary runs there.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: wasm-bindgen version from Cargo.lock
        id: bindgen
        run: |
          version="$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"$/\1/p;q}' Cargo.lock)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}

      - name: Build the web client
        run: bash scripts/build-web.sh

      - name: Build the server
        run: cargo build --release --locked -p arena-server

      - name: Bundle
        run: |
          mkdir -p bundle/bin
          cp target/release/arena-server bundle/bin/
          cp -r client/web bundle/web
          rm -f bundle/web/digest.txt
          tar -C bundle -czf bundle.tar.gz .

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          echo "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_HOST" "$(git rev-parse --short HEAD)" < bundle.tar.gz
