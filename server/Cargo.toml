[package]
name = "arena-server"
version.workspace = true
edition.workspace = true

[dependencies]
arena-shared.workspace = true
bevy = { workspace = true, features = ["std", "bevy_log", "bevy_state", "multi_threaded"] }
lightyear = { workspace = true, features = [
  "std",
  "server",
  "replication",
  "prediction",
  "interpolation",
  "input_native",
  "netcode",
  "webtransport",
  "webtransport_self_signed",
] }
# JSON log lines (ARENA_LOG_FORMAT=json); the same version Bevy's logging is built on.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std"] }
# Only to load the TLS certificate (wtransport reads it with tokio); already used by the transport.
tokio = { version = "1", default-features = false, features = ["rt", "fs"] }

[dev-dependencies]
# The integration test drives real headless clients against a real server.
arena-client.workspace = true
