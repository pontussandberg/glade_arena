<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arena</title>
  <style>
    html, body { margin: 0; height: 100%; background: #15171b; color: #ddd; font: 14px system-ui, sans-serif; overflow: hidden; }
    #game { width: 100%; height: 100%; display: block; outline: none; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0"></canvas>
  <div id="status">Loading…</div>
  <script type="module">
    const status = document.getElementById('status');
    try {
      // The dev server writes a fresh self-signed cert on every start; the browser needs its hash.
      const res = await fetch('digest.txt', { cache: 'no-store' });
      if (!res.ok) throw new Error('digest.txt missing — is the server running?');
      window.ARENA_CERT_DIGEST = (await res.text()).trim();
      const params = new URLSearchParams(location.search);
      if (params.has('server')) window.ARENA_SERVER = params.get('server');
      const { default: init } = await import('./pkg/arena-client.js');
      status.remove();
      document.getElementById('game').focus();
      await init();
    } catch (e) {
      // Bevy uses an exception for control flow when the winit loop starts; ignore that one.
      if (!String(e).includes('Using exceptions for control flow')) {
        status.textContent = 'Failed to start: ' + e;
        throw e;
      }
    }
  </script>
</body>
</html>
