[workspace]
resolver = "3"
members = ["shared", "server", "client"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
arena-shared = { path = "shared" }
arena-client = { path = "client", default-features = false }
# Pinned together: Lightyear 0.30 targets Bevy 0.19.
bevy = { version = "0.19", default-features = false }
lightyear = { version = "=0.30.1", default-features = false }
serde = { version = "1", features = ["derive"] }

# Dependencies are optimized even in dev builds; our own crates stay fast to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
# No debug info for dependencies (ours keep it, so panics and test failures still point at exact
# lines): far smaller objects, so linking Bevy is much faster and needs much less memory.
debug = false

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
